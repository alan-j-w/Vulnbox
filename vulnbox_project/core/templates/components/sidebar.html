{% load static %}
<style>
    /* --- SIDEBAR & HAMBURGER STYLES --- */
    .font-orbitron { font-family: 'Orbitron', 'Inter', sans-serif; }
    
    .sidebar {
        background-color: var(--panel-bg, rgba(20, 20, 25, 0.8)); 
        border-left: 1px solid var(--border-color, rgba(57, 255, 20, 0.2)); 
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        width: 280px; position: fixed; top: 0; right: -280px; height: 100%; z-index: 1000;
        transition: right 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
        display: flex; flex-direction: column;
        box-shadow: -5px 0 20px rgba(0, 0, 0, 0.5);
    }
    .sidebar.open { right: 0; }
    
    .sidebar-header {
        font-family: 'Orbitron', sans-serif; padding: 1.5rem; font-size: 1.5rem; font-weight: 800;
        color: var(--text-primary, #E5E7EB); text-align: center; border-bottom: 1px solid var(--border-color, rgba(57, 255, 20, 0.2));
        text-shadow: 0 0 8px var(--glow-color, rgba(57, 255, 20, 0.7));
    }
    
    .sidebar-nav { padding: 1rem; flex-grow: 1; overflow-y: auto; }
    .sidebar-nav a {
        display: flex; align-items: center; gap: 1rem; color: var(--text-secondary, #9CA3AF);
        padding: 0.85rem 1rem; border-radius: 8px; text-decoration: none; font-weight: 500;
        margin-bottom: 0.5rem; transition: all 0.2s;
    }
    .sidebar-nav a:hover, .sidebar-nav a.active { 
        background-color: rgba(57, 255, 20, 0.1); 
        color: var(--accent-green, #39FF14); 
        box-shadow: inset 0 0 10px rgba(57, 255, 20, 0.1);
    }
    .sidebar-nav a svg { width: 22px; height: 22px; flex-shrink: 0; }

    .hamburger-menu {
        cursor: pointer;
        transition: transform 0.2s;
    }
    .hamburger-menu:hover { transform: scale(1.1); }
</style>

<aside class="sidebar" id="sidebar">
    <div class="sidebar-header">VULNBOX</div>

    {% if user.is_authenticated %}
    <div class="p-4 border-b border-[var(--border-color, rgba(57, 255, 20, 0.2))] flex flex-col items-center text-center">
        {% if user.profile_picture %}
            <img src="{{ user.profile_picture.url }}" alt="Profile" class="w-20 h-20 rounded-full border-2 border-green-500/50 object-cover mb-3 shadow-[0_0_15px_rgba(57,255,20,0.3)]">
        {% else %}
            <img src="{% static 'images/default.png' %}" alt="Profile" class="w-20 h-20 rounded-full border-2 border-green-500/50 object-cover mb-3 shadow-[0_0_15px_rgba(57,255,20,0.3)]">
        {% endif %}
        <h3 class="font-bold text-base text-white truncate w-full">{{ user.username }}</h3>
        <p class="text-xs font-bold text-green-400 font-orbitron">{{ user.score|default:0 }} PTS</p>
    </div>

    <nav class="sidebar-nav">
        <a href="{% url 'core:dashboard' %}" class="{% if request.resolver_match.url_name == 'dashboard' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
            </svg>
            Dashboard
        </a>
        <a href="{% url 'core:profile' %}" class="{% if request.resolver_match.url_name == 'profile' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
            Profile
        </a>
        <a href="{% url 'core:exam_list' %}" class="{% if request.resolver_match.url_name == 'exam_list' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            Exams
        </a>
        <a href="{% url 'core:community_hub' %}" class="{% if request.resolver_match.url_name == 'community_hub' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8h2a2 2 0 012 2v6a2 2 0 01-2 2h-2v4l-4-4H9a1.994 1.994 0 01-1.414-.586m0 0L11 14h4a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2v4l.586-.586z" />
            </svg>
            Community
        </a>
        <a href="{% url 'core:leaderboard' %}" class="{% if request.resolver_match.url_name == 'leaderboard' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 012 2h2a2 2 0 012-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            Leaderboard
        </a>
        <a href="{% url 'core:submit_flag' %}" class="{% if request.resolver_match.url_name == 'submit_flag' %}active{% endif %}">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-7h1" />
            </svg>
            Submit Flag
        </a>
        
        <div class="mt-8 pt-4 border-t border-[var(--border-color, rgba(57, 255, 20, 0.1))]">
            <a href="{% url 'authapp:logout' %}" class="text-red-400 hover:text-red-300">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                Logout
            </a>
        </div>
    </nav>
{% endif %}
</aside>
