{% load static %}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}VulnBox{% endblock %}</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22black%22/><text y=%22.85em%22 x=%2215%22 font-size=%2280%22 font-weight=%22bold%22 fill=%22%2339ff14%22 font-family=%22monospace%22>V</text></svg>">

    
    <!-- Local Tailwind CSS — works on restricted networks (BSNL etc.) -->
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}">

    <style>
        /* This unique background is perfect, so we'll keep it! */
        body {
            background-color: #000000;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.07) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.07) 1px, transparent 1px);
            background-size: 3rem 3rem;
            font-family: 'Roboto Mono', monospace;
        }

        /* Blinking cursor animation */
        .cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body class="h-full flex flex-col text-green-400 bg-black">

    <header class="py-4 px-6 bg-black/80 border-b-2 border-green-500/50 backdrop-blur-sm sticky top-0 z-10">
        <div class="container mx-auto flex justify-between items-center">
            <a href="/" class="text-2xl font-bold tracking-widest cursor">VULNBOX</a>
            
            <nav class="flex items-center space-x-6">
                <a href="{% url 'core:home' %}" class="hover:text-white transition-colors duration-300">Home</a>
                <a href="{% url 'authapp:login' %}" class="hover:text-white transition-colors duration-300">Login</a>
                <a href="{% url 'authapp:signup' %}" class="font-bold hover:text-white bg-green-500/20 px-4 py-2 rounded-md transition-colors duration-300">Sign Up</a>
            </nav>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center p-4">
        {% block content %}{% endblock %}
    </main>

    <footer class="text-center p-6 text-xs text-green-400/50 font-mono">
        <div class="flex justify-center space-x-6 mb-4">
            <a href="{% url 'core:home' %}" class="hover:text-white transition-colors duration-300">Home</a>
            <a href="{% url 'core:about_developer' %}" class="hover:text-white transition-colors duration-300">About Developer</a>
        </div>
        <p class="mb-2"><i data-lucide="rocket" class="inline-block w-3 h-3 mr-1"></i> Built by <a href="https://www.linkedin.com/in/alan-joy-wilson" target="_blank" class="hover:text-white transition-colors duration-300">Alan Joy Wilson</a> | <a href="https://github.com/alan-j-w/Vulnbox" class="text-cyan-400 hover:underline">View Source</a></p>
        <p><i data-lucide="swords" class="inline-block w-3 h-3 mr-1"></i> Learn. Hack. Repeat. | VulnBox CTF © {% now "Y" %} <span class="ml-2 opacity-50">v1.0</span></p>
    </footer>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

</body>
</html>
